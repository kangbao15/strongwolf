<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sói Xám Cơ Bắp</title>

  <link rel="icon" type="image/svg+xml" href="gemini-svg.svg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, #6d3fc0 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #24143d 0%, transparent 40%),
        #09090d;
    }

    .card {
      width: min(900px, 100%);
      padding: 45px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: rgba(20, 18, 27, .72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    .content {
      display: flex;
      align-items: center;
      gap: 38px;
    }

    .logo {
      width: 190px;
      height: 190px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 15px 30px rgba(120,70,220,.25));
    }

    .info {
      flex: 1;
    }

    .tag {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(145, 92, 230, .15);
      border: 1px solid rgba(170, 120, 255, .2);
      color: #c9a9ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }

    p {
      color: #aaa7b4;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 14px;
      background: #9b63e8;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: .2s ease;
      box-shadow: 0 10px 30px rgba(155,99,232,.25);
    }

    .download:hover {
      transform: translateY(-2px);
      background: #aa76ef;
      box-shadow: 0 14px 35px rgba(155,99,232,.35);
    }

    .github {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      color: #ddd;
      text-decoration: none;
      font-weight: 600;
      transition: .2s ease;
    }

    .github:hover {
      background: rgba(255,255,255,.07);
      transform: translateY(-2px);
    }

    .version {
      margin-top: 22px;
      color: #777480;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .card {
        padding: 30px 24px;
      }

      .content {
        flex-direction: column;
        text-align: center;
      }

      .logo {
        width: 150px;
        height: 150px;
      }

      .actions {
        justify-content: center;
      }
    }
  </style>
</head>

          >

          </a>

          <a

          </a>
        </div>

        <div class="version">
          Sói Xám Cơ Bắp · Release v1.0.0
        </div>
      </section>

    </div>
  </main>
